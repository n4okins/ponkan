name: CI

on:
  push:
    branches: [main, rebuild-v3]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend checks
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check src tests
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend checks
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Compose validation
        run: docker compose config >/dev/null
        env:
          POSTGRES_PASSWORD: ci-password

      - name: Build and start stack
        run: docker compose up -d --build --wait
        env:
          POSTGRES_PASSWORD: ci-password
          PONKAN_PORT: "18080"

      - name: REST smoke test
        run: |
          curl --retry 20 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:18080/api/v1/health
          python - <<'PY'
          import json, urllib.request
          base='http://127.0.0.1:18080/api/v1'
          materials=json.load(urllib.request.urlopen(base+'/materials'))
          assert len(materials) >= 4
          ids=[m['id'] for m in materials[:4]]
          req=urllib.request.Request(base+'/study/sessions', data=json.dumps({'material_ids':ids,'limit':8}).encode(), headers={'Content-Type':'application/json'}, method='POST')
          session=json.load(urllib.request.urlopen(req))
          assert session['questions']
          q=session['questions'][0]
          req=urllib.request.Request(base+'/reviews', data=json.dumps({'question_id':q['id'],'session_id':session['session_id'],'rating':3,'response_ms':1800,'mode':'ci'}).encode(), headers={'Content-Type':'application/json'}, method='POST')
          review=json.load(urllib.request.urlopen(req))
          assert review['reps'] == 1
          print('REST smoke OK')
          PY

      - name: MCP smoke test
        run: |
          docker compose exec -T app python - <<'PY'
          import asyncio
          from mcp import Client

          async def main():
              async with Client('http://127.0.0.1:8080/mcp/') as client:
                  result = await client.list_tools()
                  names = {tool.name for tool in result.tools}
                  expected = {'list_materials','search_questions','create_study_session','submit_review','create_question','sync_import','get_learning_stats'}
                  assert expected <= names, names
                  called = await client.call_tool('get_learning_stats', {})
                  assert not called.is_error
                  print('MCP smoke OK:', client.protocol_version)
          asyncio.run(main())
          PY
        env:
          POSTGRES_PASSWORD: ci-password

      - name: Logs on failure
        if: failure()
        run: docker compose logs
        env:
          POSTGRES_PASSWORD: ci-password
          PONKAN_PORT: "18080"

      - name: Stop stack
        if: always()
        run: docker compose down -v
        env:
          POSTGRES_PASSWORD: ci-password
          PONKAN_PORT: "18080"
