name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax checks
        run: |
          python -m compileall -q server.py ponkan
          node --check public/app.js

      - name: Build Docker image
        run: docker build -t ponkan:test .

      - name: Run container
        run: docker run -d --name ponkan-test -p 18080:8080 ponkan:test

      - name: Smoke test API
        run: |
          curl --retry 15 --retry-delay 1 --retry-all-errors -fsS http://127.0.0.1:18080/api/health
          curl -fsS http://127.0.0.1:18080/ >/dev/null
          curl -fsS http://127.0.0.1:18080/api/sources | python -c "import json,sys; d=json.load(sys.stdin); assert len(d)>=4; print('sources:', len(d))"
          curl -fsS 'http://127.0.0.1:18080/api/study/session?source_ids=1,2,3,4&limit=16' | python -c "import json,sys; d=json.load(sys.stdin); assert len(d['questions'])==16; assert {'en','ru','zh-CN','ja'} <= {q['prompt_lang'] for q in d['questions']}; print('mixed session: OK')"
          curl -fsS -X POST http://127.0.0.1:18080/api/reviews -H 'Content-Type: application/json' -d '{"question_id":1,"correct":true,"response_ms":1200,"mode":"choice"}' | python -c "import json,sys; d=json.load(sys.stdin); assert d['seen']==1 and d['correct']==1; print('review/SRS: OK')"

          SOURCE_ID=$(curl -fsS -X POST http://127.0.0.1:18080/api/sources -H 'Content-Type: application/json' -d '{"name":"CI source","kind":"manual","category":"certification","default_prompt_lang":"ja","default_answer_lang":"ja"}' | python -c "import json,sys; print(json.load(sys.stdin)['id'])")
          QUESTION_ID=$(curl -fsS -X POST http://127.0.0.1:18080/api/questions -H 'Content-Type: application/json' -d "{\"source_id\":${SOURCE_ID},\"prompt\":\"CI question\",\"answer\":\"CI answer\",\"tags\":\"ci,test\"}" | python -c "import json,sys; print(json.load(sys.stdin)['id'])")
          curl -fsS -X PUT "http://127.0.0.1:18080/api/sources/${SOURCE_ID}" -H 'Content-Type: application/json' -d '{"name":"CI source updated"}' | python -c "import json,sys; assert json.load(sys.stdin)['ok']"
          curl -fsS "http://127.0.0.1:18080/api/questions?source_ids=${SOURCE_ID}" | python -c "import json,sys; d=json.load(sys.stdin); assert len(d)==1 and d[0]['prompt']=='CI question'; print('source/question CRUD: OK')"
          curl -fsS -X DELETE "http://127.0.0.1:18080/api/questions/${QUESTION_ID}" >/dev/null
          curl -fsS -X DELETE "http://127.0.0.1:18080/api/sources/${SOURCE_ID}" >/dev/null

      - name: Show logs on failure
        if: failure()
        run: docker logs ponkan-test || true

      - name: Clean up
        if: always()
        run: docker rm -f ponkan-test || true
