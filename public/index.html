<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Ponkan — adaptive study bank</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#study"><span class="logo">P</span><span><b>Ponkan</b><small>adaptive study bank</small></span></a>
  <nav>
    <button data-tab="study" class="nav active">学習</button>
    <button data-tab="sources" class="nav">教材</button>
    <button data-tab="questions" class="nav">問題</button>
    <button data-tab="stats" class="nav">統計</button>
  </nav>
</header>
<main>
  <section id="study" class="tab active">
    <div class="hero panel">
      <div><p class="eyebrow">STUDY MIX</p><h1>複数の教材を、<br>ひとつの復習キューへ。</h1><p class="muted">言語・資格・暗記科目を同じSRSで学習できます。</p></div>
      <div class="study-settings">
        <label>出題数 <input id="sessionLimit" type="number" min="5" max="100" value="20"></label>
        <div><span class="label">出題する教材</span><div id="studySourcePicker" class="check-list"></div></div>
        <button id="startStudy" class="primary wide">学習をはじめる</button>
      </div>
    </div>
    <div id="studyEmpty" class="panel center"><p>教材を選んで学習を開始してください。</p></div>
    <div id="studyCard" class="panel study-card hidden">
      <div class="study-meta"><span id="studyProgress"></span><span id="studySource" class="pill"></span></div>
      <button id="speakPrompt" class="speak" title="読み上げ">♪</button>
      <div id="prompt" class="prompt"></div>
      <div id="choices" class="choices"></div>
      <div id="revealBox" class="reveal hidden">
        <div class="answer" id="answer"></div><div class="explanation" id="explanation"></div>
        <div class="judge-row"><button id="judgeWrong" class="danger">わからなかった</button><button id="judgeCorrect" class="primary">わかった</button></div>
      </div>
      <button id="revealBtn" class="secondary wide hidden">答えを見る</button>
      <div id="feedback" class="feedback hidden"></div>
    </div>
    <div id="studyDone" class="panel center hidden"><h2>セッション完了</h2><p id="sessionSummary"></p><button id="restartStudy" class="primary">もう一度</button></div>
  </section>

  <section id="sources" class="tab">
    <div class="section-head"><div><p class="eyebrow">SOURCES</p><h1>教材ソース</h1><p class="muted">Google Sheets / CSV / 手動教材を登録できます。</p></div><button id="newSource" class="primary">＋ 教材を追加</button></div>
    <div id="sourceGrid" class="grid"></div>
  </section>

  <section id="questions" class="tab">
    <div class="section-head"><div><p class="eyebrow">QUESTION BANK</p><h1>問題バンク</h1></div><button id="newQuestion" class="primary">＋ 問題を追加</button></div>
    <div class="toolbar panel"><select id="questionSource"></select><input id="questionSearch" placeholder="問題文・解答を検索"><button id="refreshQuestions" class="secondary">検索</button></div>
    <div id="questionList" class="panel table-wrap"></div>
  </section>

  <section id="stats" class="tab">
    <div class="section-head"><div><p class="eyebrow">PROGRESS</p><h1>学習統計</h1></div></div>
    <div id="statCards" class="stat-grid"></div>
  </section>
</main>

<dialog id="sourceDialog">
<form id="sourceForm" method="dialog" class="dialog-form">
  <input type="hidden" id="sourceId">
  <div class="dialog-head"><h2 id="sourceDialogTitle">教材を追加</h2><button type="button" class="icon-btn" data-close="sourceDialog">×</button></div>
  <label>名前<input id="sourceName" required placeholder="例: 中国語 HSK4級"></label>
  <label>分類<select id="sourceCategory"><option value="language">言語</option><option value="certification">資格</option><option value="school">学校・学問</option><option value="general">その他</option></select></label>
  <label>種類<select id="sourceKind"><option value="manual">手動</option><option value="csv_url">Google Sheets / CSV URL</option></select></label>
  <label id="sourceUrlWrap">CSV URL<input id="sourceUrl" placeholder="https://docs.google.com/spreadsheets/..."></label>
  <div class="split"><label>問題側の言語<input id="sourcePromptLang" placeholder="en / ru / zh-CN / ja"></label><label>解答側の言語<input id="sourceAnswerLang" placeholder="ja"></label></div>
  <label>説明<textarea id="sourceDescription" rows="3"></textarea></label>
  <div class="dialog-actions"><button type="button" class="secondary" data-close="sourceDialog">キャンセル</button><button class="primary" value="default">保存</button></div>
</form>
</dialog>

<dialog id="questionDialog">
<form id="questionForm" method="dialog" class="dialog-form">
  <input type="hidden" id="questionId">
  <div class="dialog-head"><h2 id="questionDialogTitle">問題を追加</h2><button type="button" class="icon-btn" data-close="questionDialog">×</button></div>
  <label>教材<select id="qSource" required></select></label>
  <label>問題<textarea id="qPrompt" required rows="3"></textarea></label>
  <label>正答<textarea id="qAnswer" required rows="2"></textarea></label>
  <label>出題形式<select id="qType"><option value="auto">自動（4択を生成）</option><option value="multiple_choice">4択</option><option value="card">カード（答えを見る）</option></select></label>
  <label>選択肢 <small>「|」区切り。空欄なら他問題から自動生成</small><textarea id="qChoices" rows="2" placeholder="正答|誤答1|誤答2|誤答3"></textarea></label>
  <label>解説<textarea id="qExplanation" rows="3"></textarea></label>
  <div class="split"><label>問題側言語<input id="qPromptLang" placeholder="ja"></label><label>解答側言語<input id="qAnswerLang" placeholder="ja"></label></div>
  <label>タグ<input id="qTags" placeholder="security, web, 午前II"></label>
  <div class="dialog-actions"><button type="button" class="secondary" data-close="questionDialog">キャンセル</button><button class="primary" value="default">保存</button></div>
</form>
</dialog>

<div id="toast" class="toast hidden"></div>
<script src="/app.js" defer></script>
</body>
</html>
